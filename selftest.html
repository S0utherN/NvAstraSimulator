<main>
  <header style="display:grid;gap:6px">
    <h1>广域投影自检</h1>
    <p class="lead">检测这台设备的显卡能不能正确画出增像管天文模拟器的广域天图：用模拟器的投影代码在显卡上画一张合成天图，和 CPU 逐点算出的结果对比，并与 0.9.49 的旧写法对照。全部在本机完成，不上传任何数据。请用平时打开模拟器的那个浏览器打开本页。</p>
  </header>

  li.querySelector('.step-name').textContent = name;
  $('steps').appendChild(li);

    bad(msg) { set('bad', '失败', msg); rec.status = 'bad'; rec.msg = msg ?? ''; },
